name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  installers:
    name: Installer validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Shell syntax check
        run: bash -n scripts/*.sh
      - name: Library and test syntax check
        run: bash -n scripts/lib/*.sh tests/*.sh
      - name: Installer log capture contract
        run: bash tests/install-log-capture.sh
      - name: apt/dpkg lock wait contract
        run: bash tests/apt-lock-wait.sh
      - name: Engine log settings contract
        run: python3 tests/engine-logs.py && python3 tests/asterisk-logs.py
      - name: Database credential adapter
        run: python3 tests/database-credential.py
      - name: Phone agent event bridge
        run: python3 tests/phone-agent-runtime.py
